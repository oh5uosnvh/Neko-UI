name: Build debug candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Debug candidate name only; does not create a release or tag'
        required: true
        default: '1.4.2-mg-pre1-debug-dns02'
      version_code:
        description: 'Base version code (>=49; Android code is base x 5)'
        required: true
        default: '51'
      signed:
        description: 'Sign with the verified legacy key (requires secrets)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  libcore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: oh5uosnvh/Nekobox-MG
          ref: c91b33856ce5827a9a39e8d5d83188c505a15f32
          path: mg
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          sparse-checkout: |
            Neko-shanlian
            Neko-viewTurbo
            Neko-fastup
            Neko-oppa
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      - name: Stage pinned protocol modules at go.mod replacement paths
        run: |
          set -euo pipefail
          cp -a mg/Neko-shanlian ../sing-anytls-shanlian
          cp -a mg/Neko-viewTurbo ../sing-shadowsocks2-vt
          cp -a mg/Neko-fastup ../fastup-mod
          cp -a mg/Neko-oppa ../oppa-mod
      - name: Validate subscription DNS parser before building
        run: python3 buildScript/test-subscription-dns.py
      - name: Verify pinned DNS runtime and TLS identity
        run: |
          bash buildScript/lib/core/get_source.sh
          cd libcore
          go test -race -count=1 ./dnspolicy
      - name: Build libcore
        run: ./run lib core
      - uses: actions/upload-artifact@v4
        with:
          name: libcore
          path: app/libs/libcore.aar
          if-no-files-found: error

  build:
    runs-on: ubuntu-24.04
    needs: libcore
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: libcore
          path: app/libs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      - name: Retrieve legacy signing key only for an explicitly signed build
        if: ${{ inputs.signed }}
        uses: actions/checkout@v4
        with:
          repository: oh5uosnvh/Nekobox-MG
          ref: a2267e3e51ff4aa851db4a247b2749dd36f6dfcb
          path: mg-sign
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          sparse-checkout: keystore/release.keystore
          sparse-checkout-cone-mode: false
      - name: Build candidate APKs
        env:
          APP_VERSION_NAME: ${{ inputs.release_tag }}
          APP_PRE_VERSION_NAME: ${{ inputs.release_tag }}
          APP_VERSION_CODE: ${{ inputs.version_code }}
          SIGNED: ${{ inputs.signed }}
          KEYSTORE_PASS: ${{ inputs.signed && secrets.KEYSTORE_PASS || '' }}
          ALIAS_NAME: ${{ inputs.signed && secrets.ALIAS_NAME || '' }}
          ALIAS_PASS: ${{ inputs.signed && secrets.ALIAS_PASS || '' }}
          FORCE_HEV: '1'
        run: |
          set -euo pipefail
          trap 'rm -f release.keystore; rm -rf mg-sign' EXIT
          [[ "$APP_VERSION_NAME" == *-debug-* ]] || { echo 'This branch only builds debug-named candidates' >&2; exit 1; }
          [[ "$APP_VERSION_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,99}$ ]] || { echo 'Invalid candidate version' >&2; exit 1; }
          [[ "$APP_VERSION_CODE" =~ ^[1-9][0-9]{0,8}$ ]] && (( 10#$APP_VERSION_CODE >= 49 && 10#$APP_VERSION_CODE <= 420000000 )) || { echo 'Base version code must be 49..420000000' >&2; exit 1; }
          if [[ "$SIGNED" == true ]]; then
            [[ -n "$KEYSTORE_PASS" && -n "$ALIAS_NAME" && -n "$ALIAS_PASS" && -f mg-sign/keystore/release.keystore ]] || { echo 'Signing credentials or keystore missing' >&2; exit 1; }
            cp mg-sign/keystore/release.keystore release.keystore
            chmod 600 release.keystore
            rm -rf mg-sign
            fingerprint=$(keytool -exportcert -alias "$ALIAS_NAME" -keystore release.keystore -storepass:env KEYSTORE_PASS | sha256sum | cut -d' ' -f1)
            [[ "$fingerprint" == 521ea638c17fdee184998b4a3cf9b10fa6272b9806fae34b19ca3fffe5d4556a ]] || { echo 'Unexpected signing certificate' >&2; exit 1; }
          else
            unset KEYSTORE_PASS ALIAS_NAME ALIAS_PASS
          fi
          ./run init action gradle
          ./gradlew --no-daemon app:testPreviewDebugUnitTest --tests 'io.nekohasekai.sagernet.group.*'
          ./gradlew --no-daemon app:assemblePreviewRelease
          mkdir -p release
          shopt -s nullglob
          apks=(app/build/outputs/apk/preview/release/*.apk)
          (( ${#apks[@]} > 0 )) || { echo 'No APKs found' >&2; exit 1; }
          if [[ "$SIGNED" == true ]]; then
            for apk in "${apks[@]}"; do
              "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-certs.txt"
              python3 buildScript/verify-apk-cert.py "$RUNNER_TEMP/apk-certs.txt"
            done
          fi
          cp "${apks[@]}" release/
          (cd release && sha256sum ./*.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-apks
          path: release/
          if-no-files-found: error

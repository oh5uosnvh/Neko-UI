name: Build pre26 husi core upgrade

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Debug candidate name only; does not create a release or tag'
        required: true
        default: '1.4.2-mg-debug-husi15-upgrade'
      version_code:
        description: 'Base version code (>=49; Android code is base x 5)'
        required: true
        default: '2066'
      signed:
        description: 'Sign with the verified legacy key (requires secrets)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pre26-husi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libcore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: oh5uosnvh/Nekobox-MG
          ref: c91b33856ce5827a9a39e8d5d83188c505a15f32
          path: mg
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          sparse-checkout: |
            Neko-shanlian
            Neko-viewTurbo
            Neko-fastup
            Neko-oppa
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: libcore/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      - name: Stage pinned protocol modules at go.mod replacement paths
        run: |
          set -euo pipefail
          cp -a mg/Neko-shanlian ../sing-anytls-shanlian
          cp -a mg/Neko-viewTurbo ../sing-shadowsocks2-vt
          cp -a mg/Neko-fastup ../fastup-mod
          cp -a mg/Neko-oppa ../oppa-mod
      - name: Validate subscription DNS parser before building
        run: python3 buildScript/test-subscription-dns.py
      - name: Guard Android production network bridge against forbidden Go netlink enumeration
        run: python3 buildScript/verify-android-network-bridge.py
      - name: Ensure libcore working tree is clean before gomobile bind
        run: |
          cd libcore
          if [ -n "$(git status --porcelain)" ]; then
            echo "libcore working tree has uncommitted changes:"
            git status --porcelain
            exit 1
          fi
      - name: Resolve migrated module checksums on GitHub Actions
        env:
          SING_BOX_CLONE_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          bash buildScript/lib/core/get_source.sh
          cd libcore
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go list -m github.com/sagernet/sing-box github.com/sagernet/quic-go
          mkdir -p ../core-audit
          cp go.mod go.sum ../core-audit/
      - name: Verify pinned DNS runtime and TLS identity
        run: |
          cd libcore
          go test -race -count=1 -skip 'TestRealTCPCancellationClosesBlockedConnection' ./dnspolicy
      - name: Verify Android production networking with denied netlink and protect IPC
        run: |
          cd libcore
          go test -p 1 -race -v -timeout=4m -count=1 -tags 'with_conntrack,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api' \
            -run '^(TestAndroidNetwork|TestAndroidSocketProtection|TestAndroidProtectIPC)' .
      - name: Verify husi URLTest, protocol and platform regression tests
        run: |
          cd libcore
          go test -p 2 -race -timeout=4m -count=1 -skip 'TestRealTCPCancellationClosesBlockedConnection|TestPre26AppConfigFixtures' -tags 'with_conntrack,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api' ./...
      - name: Verify upgraded core compatibility and actual fragment behavior
        run: |
          cd libcore
          go test -p 2 -race -timeout=4m -count=1 -tags 'with_conntrack,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api' \
            -run 'TestNeko' github.com/sagernet/sing-box/option github.com/sagernet/sing-box/dns \
            github.com/sagernet/sing-box/protocol/direct github.com/sagernet/sing-box/route github.com/sagernet/sing-box/route/rule github.com/sagernet/sing-box/common/dialer github.com/sagernet/sing-box/transport/v2rayxhttp
      - name: Build libcore
        env:
          SING_BOX_CLONE_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ./run lib core
          python3 buildScript/core-provenance.py
          mkdir -p core-audit
          cp app/src/main/assets/core-provenance.json core-audit/
          python3 buildScript/verify-aar-api.py app/libs/libcore.aar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-audit
          path: core-audit/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: libcore
          path: app/libs/libcore.aar
          if-no-files-found: error

  build:
    runs-on: ubuntu-24.04
    needs: libcore
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: libcore
          path: app/libs
      - uses: actions/download-artifact@v4
        with:
          name: core-audit
          path: core-audit
      - name: Restore verified core provenance for the APK
        run: cp core-audit/core-provenance.json app/src/main/assets/core-provenance.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: libcore/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      - uses: actions/checkout@v4
        with:
          repository: oh5uosnvh/Nekobox-MG
          ref: c91b33856ce5827a9a39e8d5d83188c505a15f32
          path: mg
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          sparse-checkout: |
            Neko-shanlian
            Neko-viewTurbo
            Neko-fastup
            Neko-oppa
      - name: Stage the same pinned modules for App config validation
        env:
          SING_BOX_CLONE_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cp -a mg/Neko-shanlian ../sing-anytls-shanlian
          cp -a mg/Neko-viewTurbo ../sing-shadowsocks2-vt
          cp -a mg/Neko-fastup ../fastup-mod
          cp -a mg/Neko-oppa ../oppa-mod
          bash buildScript/lib/core/get_source.sh
          cp core-audit/go.mod core-audit/go.sum libcore/
      - name: Retrieve legacy signing key only for an explicitly signed build
        if: ${{ inputs.signed }}
        uses: actions/checkout@v4
        with:
          repository: oh5uosnvh/Nekobox-MG
          ref: a2267e3e51ff4aa851db4a247b2749dd36f6dfcb
          path: mg-sign
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          sparse-checkout: keystore/release.keystore
          sparse-checkout-cone-mode: false
      - name: Build candidate APKs
        env:
          APP_VERSION_NAME: ${{ inputs.release_tag }}
          APP_PRE_VERSION_NAME: ${{ inputs.release_tag }}
          APP_VERSION_CODE: ${{ inputs.version_code }}
          SIGNED: ${{ inputs.signed }}
          KEYSTORE_PASS: ${{ inputs.signed && secrets.KEYSTORE_PASS || '' }}
          ALIAS_NAME: ${{ inputs.signed && secrets.ALIAS_NAME || '' }}
          ALIAS_PASS: ${{ inputs.signed && secrets.ALIAS_PASS || '' }}
          FORCE_HEV: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'rm -f release.keystore; rm -rf mg-sign' EXIT
          [[ "$APP_VERSION_NAME" == *-debug-* ]] || { echo 'This migration branch builds debug-named candidates only' >&2; exit 1; }
          [[ "$APP_VERSION_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,99}$ ]] || { echo 'Invalid candidate version' >&2; exit 1; }
          [[ "$APP_VERSION_CODE" =~ ^[1-9][0-9]{0,8}$ ]] && (( 10#$APP_VERSION_CODE >= 2066 && 10#$APP_VERSION_CODE <= 420000000 )) || { echo 'Base version code must be 2066..420000000 to upgrade pre26' >&2; exit 1; }
          if [[ "$SIGNED" == true ]]; then
            [[ -n "$KEYSTORE_PASS" && -n "$ALIAS_NAME" && -n "$ALIAS_PASS" && -f mg-sign/keystore/release.keystore ]] || { echo 'Signing credentials or keystore missing' >&2; exit 1; }
            cp mg-sign/keystore/release.keystore release.keystore
            chmod 600 release.keystore
            rm -rf mg-sign
            fingerprint=$(keytool -exportcert -alias "$ALIAS_NAME" -keystore release.keystore -storepass:env KEYSTORE_PASS | sha256sum | cut -d' ' -f1)
            [[ "$fingerprint" == 521ea638c17fdee184998b4a3cf9b10fa6272b9806fae34b19ca3fffe5d4556a ]] || { echo 'Unexpected signing certificate' >&2; exit 1; }
          else
            unset KEYSTORE_PASS ALIAS_NAME ALIAS_PASS
          fi
          ./run init action gradle
          # Bootstrap the exact wrapper distribution via the official asset API;
          # services.gradle.org redirects can fail while this endpoint works.
          python3 buildScript/download-github-asset.py \
            https://api.github.com/repos/gradle/gradle-distributions/releases/assets/194456564 \
            "$RUNNER_TEMP/gradle-8.10.2-bin.zip"
          echo "31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26  $RUNNER_TEMP/gradle-8.10.2-bin.zip" | sha256sum -c -
          python3 - "$RUNNER_TEMP/gradle-8.10.2-bin.zip" <<'PY'
          import pathlib, sys
          wrapper = pathlib.Path('gradle/wrapper/gradle-wrapper.properties')
          wrapper.write_text(wrapper.read_text().replace(
              'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-bin.zip',
              'distributionUrl=' + pathlib.Path(sys.argv[1]).as_uri()))
          PY
          # Resolve only this exact module from a hash-verified local Maven
          # directory: Gradle otherwise HEADs the failing remote even with a jar cache.
          export NEKO_PINNED_MAVEN="$RUNNER_TEMP/pinned-maven"
          compiler_cache="$NEKO_PINNED_MAVEN/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21"
          mkdir -p "$compiler_cache"
          python3 buildScript/download-github-asset.py \
            https://api.github.com/repos/JetBrains/kotlin/releases/assets/587823233 \
            "$compiler_cache/kotlin-compiler-embeddable-2.0.21.jar"
          echo "9fa8cdd1de0dccffe154c997d423ec6b5f53cd6d9177e3a77a9b0de03fb1bc81  $compiler_cache/kotlin-compiler-embeddable-2.0.21.jar" | sha256sum -c -
          curl -fLSs --retry 3 --max-time 60 \
            https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21/kotlin-compiler-embeddable-2.0.21.pom \
            -o "$compiler_cache/kotlin-compiler-embeddable-2.0.21.pom"
          echo "bd4656a46ec418252e5bc5e1c20eb2029fb2a8e0e3cc94eeddfac7e87c8cd5b6  $compiler_cache/kotlin-compiler-embeddable-2.0.21.pom" | sha256sum -c -
          export NEKO_CONFIG_FIXTURE_DIR="$RUNNER_TEMP/pre26-config-fixtures"
          ./gradlew --no-daemon -Dneko.config.fixtureDir="$NEKO_CONFIG_FIXTURE_DIR" app:testPreviewDebugUnitTest
          python3 buildScript/verify-configbuilder-fixtures.py --fixture-dir "$NEKO_CONFIG_FIXTURE_DIR" --run-go
          ./gradlew --no-daemon app:assemblePreviewRelease
          mkdir -p release/apk-audit
          shopt -s nullglob
          apks=(app/build/outputs/apk/preview/release/*.apk)
          (( ${#apks[@]} > 0 )) || { echo 'No APKs found' >&2; exit 1; }
          if [[ "$SIGNED" == true ]]; then
            for apk in "${apks[@]}"; do
              "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-certs.txt"
              python3 buildScript/verify-apk-cert.py "$RUNNER_TEMP/apk-certs.txt"
            done
          fi
          for apk in "${apks[@]}"; do
            python3 buildScript/verify-upgrade-apk.py "$apk" \
              --version "$APP_VERSION_NAME" --code "$((10#$APP_VERSION_CODE * 5))" \
              --revision "$GITHUB_SHA" --report "release/apk-audit/$(basename "$apk").json"
          done
          cp core-audit/core-provenance.json release/apk-audit/
          cp "${apks[@]}" release/
          (cd release && sha256sum ./*.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-config-fixtures
          path: ${{ runner.temp }}/pre26-config-fixtures/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            app/build/test-results/testPreviewDebugUnitTest/
            app/build/reports/tests/testPreviewDebugUnitTest/
            app/build/reports/ui-pre4/
            app/build/reports/ui-pre12/
            app/build/reports/ui-pre13/
            app/build/reports/ui-pre14/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-apks
          path: release/
          if-no-files-found: error

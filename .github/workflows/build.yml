name: Build from patches

# NekoBoxF = upstream NekoBoxForAndroid  +  Neko-UI 10 UI patches
#            +  Nekobox-MG protocol mods (x365 / xhttp / shanlian / vt / fastup / oppa)
#
# The protocol mods are NOT baked into the upstream checkout: this workflow
# pulls Nekobox-MG at a pinned ref and injects its patched integration layer so
# the two repos always build together from a single run.

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: '上游源码仓库 (owner/name)'
        required: true
        default: 'oh5uosnvh/NekoBoxForAndroid'
      upstream_ref:
        description: '上游分支/标签/commit'
        required: true
        default: 'A01'
      mods_ref:
        description: 'Nekobox-MG ref (协议魔改源码, 空=HEAD)'
        required: false
        default: ''
      anytls_commit:
        description: 'sing-anytls-shanlian commit (空=HEAD)'
        required: false
        default: ''
      vt_commit:
        description: 'sing-shadowsocks2-vt commit (空=HEAD)'
        required: false
        default: ''
      fastup_commit:
        description: 'fastup-mod commit (空=HEAD)'
        required: false
        default: ''
      oppa_commit:
        description: 'oppa-mod commit (空=HEAD)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-from-patches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- wire test
  # Compiles Nekobox-MG's x365 package and runs the byte-exact vectors captured
  # from the official 1.0.63 client. Fails in ~30s instead of ~20min.
  wire-test:
    name: x365 wire-format tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kit
        uses: actions/checkout@v4

      - name: Clone Nekobox-MG (protocol mods)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          MODS_REF: ${{ github.event.inputs.mods_ref }}
        run: |
          set -euo pipefail
          URL="https://github.com/oh5uosnvh/Nekobox-MG.git"
          [ -n "$GH_PAT" ] && URL="https://x-access-token:${GH_PAT}@github.com/oh5uosnvh/Nekobox-MG.git"
          git clone --depth 1 "$URL" mods
          if [ -n "$MODS_REF" ]; then
            git -C mods fetch --depth 1 origin "$MODS_REF"
            git -C mods checkout --detach FETCH_HEAD
          fi
          git -C mods log --oneline -1

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Build minimal module around protocol/x365
        run: |
          set -euo pipefail
          rm -rf wirecheck && mkdir -p wirecheck/x365
          cp mods/Neko-365/libcore/protocol/x365/conn.go \
             mods/Neko-365/libcore/protocol/x365/conn_test.go wirecheck/x365/
          cd wirecheck
          cat > go.mod <<'EOF'
          module x365check

          go 1.23

          require (
              github.com/gofrs/uuid/v5 v5.3.0
              github.com/sagernet/sing v0.6.0
              github.com/sagernet/sing-vmess v0.2.0
          )
          EOF

      - name: go mod tidy
        working-directory: wirecheck
        env:
          GOFLAGS: -mod=mod
          GOTOOLCHAIN: local
        run: go mod tidy

      - name: Run wire tests
        working-directory: wirecheck
        env:
          GOFLAGS: -mod=mod
          GOTOOLCHAIN: local
        run: go test ./x365/ -v

  # -------------------------------------------------------------------- build
  build:
    name: Build patched APK
    runs-on: ubuntu-latest
    needs: wire-test
    timeout-minutes: 90
    steps:
      - name: Checkout kit
        uses: actions/checkout@v4

      - name: Clone upstream source (with submodules)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.event.inputs.upstream_repo }}
          REF: ${{ github.event.inputs.upstream_ref }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          fi
          git clone --recurse-submodules --jobs 8 "https://github.com/${REPO}.git" upstream
          cd upstream
          git checkout "$REF"
          git submodule update --init --recursive --jobs 8
          git log --oneline -1

      - name: Clone Nekobox-MG (protocol mods)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          MODS_REF: ${{ github.event.inputs.mods_ref }}
        run: |
          set -euo pipefail
          URL="https://github.com/oh5uosnvh/Nekobox-MG.git"
          [ -n "$GH_PAT" ] && URL="https://x-access-token:${GH_PAT}@github.com/oh5uosnvh/Nekobox-MG.git"
          git clone --depth 1 "$URL" mods
          if [ -n "$MODS_REF" ]; then
            git -C mods fetch --depth 1 origin "$MODS_REF"
            git -C mods checkout --detach FETCH_HEAD
          fi
          echo "mods @ $(git -C mods log --oneline -1)"

      - name: Apply Nekobox-MG protocol mods
        run: |
          set -euo pipefail
          # Two cases:
          #  a) upstream is a BARE NekoBoxForAndroid -> integrate.sh applies
          #     patches/000-integration.patch (40 modified files) then overlays
          #     files/ (12 new files).
          #  b) upstream already carries the integration (tag A01 and friends)
          #     -> patching again would conflict, so we only refresh the
          #     protocol sources from Nekobox-MG, which is what we actually
          #     want to ship.
          # Never let the x365 refresh silently replace a newer Blackstone
          # implementation with an archived fixed-magic cipher again.
          for file in cipher.go cipher_test.go outbound.go; do
            cmp mods/Neko-xhttp/libcore/protocol/xhttp/$file \
                mods/Neko-gjgx/files/libcore/protocol/xhttp/$file
          done
          cd upstream
          if [ -f libcore/protocol/x365/conn.go ] && grep -q libcoreX365 libcore/box_include.go; then
            echo ">> upstream already integrated — refreshing x365 and Blackstone independently"
            test -d libcore/protocol/xhttp
            cp -v ../mods/Neko-365/libcore/protocol/x365/*.go libcore/protocol/x365/
            cp -v ../mods/Neko-xhttp/libcore/protocol/xhttp/*.go libcore/protocol/xhttp/
          else
            echo ">> bare upstream — running full integration"
            bash ../mods/Neko-gjgx/integrate.sh .
          fi

      - name: Assert current x365 is in place
        run: |
          set -euo pipefail
          cd upstream
          for f in libcore/protocol/x365/conn.go \
                   libcore/protocol/x365/outbound.go \
                   libcore/protocol/xhttp/outbound.go \
                   libcore/protocol/xhttp/cipher.go ; do
            [ -f "$f" ] || { echo "::error::$f missing after integration"; exit 1; }
          done
          # A 5-byte X365+00 in a memory dump was incorrectly labelled a
          # client prologue. The captured 29-byte request is the supported
          # evidence; fail fast if that unverified addition comes back.
          ! grep -q 'PrologueVersion' libcore/protocol/x365/conn.go \
            || { echo "::error::unverified x365 prologue reintroduced"; exit 1; }
          grep -q 'libcoreX365' libcore/box_include.go \
            || { echo "::error::x365 outbound not registered"; exit 1; }
          grep -q 'libcoreXhttp.RegisterOutbound' libcore/box_include.go \
            || { echo "::error::Blackstone outbound not registered"; exit 1; }
          grep -q 'Chrome/120.0.0.0' libcore/protocol/x365/outbound.go
          grep -q 'magicSuffix = "do not hack this protocol please"' libcore/protocol/xhttp/cipher.go
          grep -q '11cb12c8cf84e0568896a7f6bd61ab53' libcore/protocol/xhttp/cipher.go
          cmp libcore/protocol/xhttp/cipher.go ../mods/Neko-xhttp/libcore/protocol/xhttp/cipher.go
          echo "x365 + Blackstone mods applied:"; git -C . diff --stat -- libcore app | tail -3

      - name: Apply mod patches (23)
        run: |
          cd upstream
          python3 "$GITHUB_WORKSPACE/scripts/apply_all.py"

      - name: Assert 011 group-update progress fix is in place
        run: |
          set -euo pipefail
          cd upstream
          F=app/src/main/java/io/nekohasekai/sagernet/group/GroupUpdater.kt
          grep -q 'GroupManager.postUpdate(proxyGroup.id)' "$F" \
            || { echo "::error::011 fix missing (progress bar sticky bug)"; exit 1; }
          ! grep -q 'GroupManager.postUpdate(proxyGroup)$' "$F" \
            || { echo "::error::011 not applied (old same-instance broadcast)"; exit 1; }
          echo "011 group-update progress fix present"

      - name: Assert 012 connection-test fixes are in place
        run: |
          set -euo pipefail
          cd upstream
          F=app/src/main/java/io/nekohasekai/sagernet/ui/ConfigurationFragment.kt
          grep -q 'fun scheduleFlush()' "$F" \
            || { echo "::error::012 live flush missing"; exit 1; }
          [ "$(grep -c 'test.flushPending()' "$F")" = "2" ] \
            || { echo "::error::012 cancel flush wiring wrong"; exit 1; }
          ! grep -q 'test.results.forEach' "$F" \
            || { echo "::error::012 not applied (old sequential write-back)"; exit 1; }
          echo "012 connection-test fixes present"

      - name: Assert 013 connection-test speed/cancel fix is in place
        run: |
          set -euo pipefail
          cd upstream
          T=app/src/main/java/io/nekohasekai/sagernet/bg/proto/TestInstance.kt
          grep -q 'suspendCancellableCoroutine' "$T" \
            || { echo "::error::013 cancellable test missing"; exit 1; }
          grep -q 'invokeOnCancellation' "$T" \
            || { echo "::error::013 close-on-cancel missing"; exit 1; }
          grep -q 'doTest(context: CoroutineContext)' "$T" \
            || { echo "::error::013 dedicated dispatcher missing"; exit 1; }
          F=app/src/main/java/io/nekohasekai/sagernet/ui/ConfigurationFragment.kt
          grep -q 'newFixedThreadPool' "$F" \
            || { echo "::error::013 test pool missing"; exit 1; }
          grep -q 'UrlTest(testPool)' "$F" \
            || { echo "::error::013 pool not wired into UrlTest"; exit 1; }
          echo "013 connection-test speed/cancel fixes present"

      - name: Assert 014 delete-unavailable undo is in place
        run: |
          set -euo pipefail
          cd upstream
          F=app/src/main/java/io/nekohasekai/sagernet/ui/ConfigurationFragment.kt
          [ "$(grep -c 'undoManager.remove(visible)' "$F")" = "2" ] \
            || { echo "::error::014 undo channel not wired (need 2 call sites)"; exit 1; }
          grep -q 'fun isUndoReady()' "$F" \
            || { echo "::error::014 isUndoReady missing"; exit 1; }
          echo "014 delete-unavailable undo present"

      - name: Assert 015 settings menu NPE guard is in place
        run: |
          set -euo pipefail
          cd upstream
          for f in app/src/main/java/io/nekohasekai/sagernet/ui/GroupSettingsActivity.kt \
                   app/src/main/java/io/nekohasekai/sagernet/ui/profile/ProfileSettingsActivity.kt \
                   app/src/main/java/io/nekohasekai/sagernet/ui/RouteSettingsActivity.kt; do
            grep -q 'as? MyPreferenceFragmentCompat' "$f" \
              || { echo "::error::015 null-safe child missing in $f"; exit 1; }
            ! grep -q 'val child by lazy' "$f" \
              || { echo "::error::015 old unsafe lazy cast still present in $f"; exit 1; }
          done
          echo "015 settings menu NPE guards present"

      - name: Assert 016 preference editor unify is in place
        run: |
          set -euo pipefail
          cd upstream
          P=app/src/main/java/io/nekohasekai/sagernet/ui/profile/ProfileSettingsActivity.kt
          ! grep -q 'PasswordDialogFragment.newInstance' "$P" \
            || { echo "::error::016 not applied (password dialog branch still present)"; exit 1; }
          test ! -f app/src/main/java/io/nekohasekai/sagernet/ui/profile/PasswordDialogFragment.kt \
            || { echo "::error::016 dead PasswordDialogFragment still exists"; exit 1; }
          echo "016 preference editor unify present"

      - name: Assert 017 bottom connect bar is in place
        run: |
          set -euo pipefail
          cd upstream
          M=app/src/main/java/io/nekohasekai/sagernet/ui/MainActivity.kt
          test -f app/src/main/java/io/nekohasekai/sagernet/widget/ConnectBar.kt \
            || { echo "::error::017 ConnectBar missing"; exit 1; }
          test -f app/src/main/java/io/nekohasekai/sagernet/ui/OutboundIpDialogFragment.kt \
            || { echo "::error::017 OutboundIpDialogFragment missing"; exit 1; }
          grep -q 'connect_bar' app/src/main/res/layout/layout_main.xml \
            || { echo "::error::017 layout not rewired"; exit 1; }
          ! grep -q 'io.nekohasekai.sagernet.widget.StatsBar' app/src/main/res/layout/layout_main.xml \
            || { echo "::error::017 old StatsBar still in layout"; exit 1; }
          ! grep -q 'binding\.fab\|binding\.stats' "$M" \
            || { echo "::error::017 MainActivity still binds fab/stats"; exit 1; }
          ! grep -q 'showBottomBar' app/src/main/java/io/nekohasekai/sagernet/Constants.kt \
            || { echo "::error::017 showBottomBar pref not removed"; exit 1; }
          grep -q 'connectBar.onTestConnection' app/src/main/java/io/nekohasekai/sagernet/ui/MainActivity.kt \
            || { echo "::error::019 delay zone not wired (would stick on testing)"; exit 1; }
          grep -q 'syncConnectBar' app/src/main/java/io/nekohasekai/sagernet/ui/MainActivity.kt \
            || { echo "::error::021 config-only visibility missing"; exit 1; }
          grep -q 'bg_touch_rounded' app/src/main/res/layout/layout_connect_bar.xml \
            || { echo "::error::023 unified rounded touch bg missing"; exit 1; }
          ! grep -q '延迟 %d ms' app/src/main/res/values-zh-rCN/strings.xml \
            || { echo "::error::023 delay prefix not removed"; exit 1; }
          ! test -f app/src/main/java/io/nekohasekai/sagernet/widget/ServiceButton.kt \
            || { echo "::error::021 ServiceButton should be gone"; exit 1; }
          echo "017+019+021 bottom connect bar present"

      - name: Assert 018 group tab menu + undo delete is in place
        run: |
          set -euo pipefail
          cd upstream
          F=app/src/main/java/io/nekohasekai/sagernet/ui/ConfigurationFragment.kt
          grep -q 'deleteGroupWithUndo' "$F" \
            || { echo "::error::018 group undo delete missing"; exit 1; }
          grep -q 'R.string.jump_to_group' "$F" \
            || { echo "::error::018 tab long-press menu missing"; exit 1; }
          grep -q 'group_deleted_undo' "$F" \
            || { echo "::error::018 undo snackbar string missing"; exit 1; }
          echo "018 group tab menu + undo present"

      - name: Assert 019/020 polish and undo fix are in place
        run: |
          set -euo pipefail
          cd upstream
          F=app/src/main/java/io/nekohasekai/sagernet/ui/ConfigurationFragment.kt
          grep -q 'restoreGroupAt' "$F" \
            || { echo "::error::020/022 undo pager sync missing"; exit 1; }
          grep -q 'fun restoreGroupAt' "$F" \
            || { echo "::error::022 in-position restore missing"; exit 1; }
          D=app/src/main/java/io/nekohasekai/sagernet/ui/OutboundIpDialogFragment.kt
          grep -q 'country' "$D" || { echo "::error::019 country field missing"; exit 1; }
          grep -q 'bindCopy' "$D" || { echo "::error::019 copy-on-tap missing"; exit 1; }
          grep -q 'row_country\|ip_country_value' app/src/main/res/layout/layout_outbound_ip_dialog.xml \
            || { echo "::error::019 country row missing"; exit 1; }
          echo "019/020 polish + undo fix present"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: '^1.25'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      # Resolve every external mod repo to a concrete commit. The 2026-10-05
      # rebuild recreated these repos and changed all shas; empty input = HEAD.
      - name: Resolve external mod refs
        id: resolve
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          resolve() {
            repo="$1"; ref="$2"
            if [ -n "$ref" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token ${GH_PAT}" \
                     "https://api.github.com/repos/${repo}/commits/${ref}")
              if [ "$code" = "200" ]; then echo "$ref"; return; fi
              echo "::warning::${repo}: ref '${ref}' not found (HTTP ${code}); using HEAD" >&2
            fi
            curl -s -H "Authorization: token ${GH_PAT}" \
              "https://api.github.com/repos/${repo}/commits/HEAD" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["sha"])'
          }
          ANYTLS=$(resolve oh5uosnvh/sing-anytls-shanlian "${{ github.event.inputs.anytls_commit }}")
          VT=$(resolve oh5uosnvh/sing-shadowsocks2-vt "${{ github.event.inputs.vt_commit }}")
          FASTUP=$(resolve oh5uosnvh/fastup-mod "${{ github.event.inputs.fastup_commit }}")
          OPPA=$(resolve oh5uosnvh/oppa-mod "${{ github.event.inputs.oppa_commit }}")
          echo "anytls=${ANYTLS}" >> "$GITHUB_OUTPUT"
          echo "vt=${VT}"         >> "$GITHUB_OUTPUT"
          echo "fastup=${FASTUP}" >> "$GITHUB_OUTPUT"
          echo "oppa=${OPPA}"     >> "$GITHUB_OUTPUT"

      - name: Pin external mod repos
        env:
          ANYTLS: ${{ steps.resolve.outputs.anytls }}
          VT: ${{ steps.resolve.outputs.vt }}
          FASTUP: ${{ steps.resolve.outputs.fastup }}
          OPPA: ${{ steps.resolve.outputs.oppa }}
        run: |
          set -euo pipefail
          cd upstream
          F=buildScript/lib/core/get_source_env.sh
          [ -f "$F" ] || { echo "::error::$F missing"; exit 1; }
          set_kv() {
            key="$1"; val="$2"
            if grep -q "^export ${key}=" "$F"; then
              sed -i "s|^export ${key}=.*|export ${key}=\"${val}\"|" "$F"
            else
              echo "export ${key}=\"${val}\"" >> "$F"
            fi
          }
          set_kv COMMIT_ANYTLS_SHANLIAN "$ANYTLS"
          set_kv COMMIT_SING_SS_VT       "$VT"
          set_kv COMMIT_FASTUP_MOD       "$FASTUP"
          set_kv COMMIT_OPPA_MOD         "$OPPA"
          echo "--- $F ---"; cat "$F"

      - name: LibCore cache key
        id: libcore-key
        run: |
          cd upstream
          # Source overlays are not git-tracked. Hash the actual bytes being
          # built, including newly overlaid protocol files and symlink targets.
          K=$( { find libcore buildScript -type f -print0 | sort -z | xargs -0 sha256sum; git rev-parse HEAD; } | sha256sum | cut -d' ' -f1 )
          echo "key=libcore-$K" >> "$GITHUB_OUTPUT"

      - name: LibCore cache
        id: libcore-cache
        uses: actions/cache@v4
        with:
          path: upstream/app/libs/libcore.aar
          key: ${{ steps.libcore-key.outputs.key }}

      - name: Build LibCore
        if: steps.libcore-cache.outputs.cache-hit != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GOSUMDB: off
        run: |
          cd upstream
          go version
          ./run lib core

      - name: Test integrated x365 and Blackstone independently
        if: steps.libcore-cache.outputs.cache-hit != 'true'
        env:
          GOSUMDB: off
        run: |
          set -euo pipefail
          cd upstream/libcore
          go test ./protocol/x365 -run 'TestPrepareX365Transport|TestEncodeMatchesLiveCapture' -count=1 -v
          go test ./protocol/xhttp -run 'TestBlackstoneRotatedMagicAndKey' -count=1 -v

      - name: Restore stable signing keystore (from private Nekobox-MG)
        run: |
          set -euo pipefail
          # 覆盖上游自带的 starifly release.keystore（口令不在本仓库）。
          # 稳定签名 = 跨构建可覆盖安装；比 debug 构建的 runner 随机调试签名强。
          cp mods/keystore/release.keystore upstream/release.keystore
          test -s upstream/release.keystore
          echo "keystore restored: $(sha256sum upstream/release.keystore | cut -c1-16)…"

      - name: Relax release lint gate
        run: |
          set -euo pipefail
          # checkAllWarnings+warningsAsErrors 是 debug 期全量 lint 策略；release 构建只
          # 保留 lintVital 的 fatal 检查关不动的部分。CI 不让 lint 噪音挡出包。
          cd upstream
          sed -i 's/checkReleaseBuilds = true/checkReleaseBuilds = false/' \
            buildSrc/src/main/kotlin/Helpers.kt
          grep -n 'checkReleaseBuilds' buildSrc/src/main/kotlin/Helpers.kt

      - name: Build APK (release = R8 shrink + shrinkResources, signed)
        env:
          BUILD_PLUGIN: none
          GOSUMDB: off
        run: |
          cd upstream
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_NDK_HOME}" >> local.properties
          ./run init action gradle
          set -a; . ../mods/keystore/keystore.properties; set +a
          ./gradlew app:assemblePreviewRelease
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk' | head -1)
          echo "APK_PATH=$APK"
          echo "APK_DIR=$(realpath $(dirname $APK))" >> $GITHUB_ENV

      - name: Verify mods are in the binary
        run: |
          set -euo pipefail
          cd upstream
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk' | head -1)
          unzip -o -q "$APK" 'lib/arm64-v8a/libgojni.so' -d /tmp/apkchk
          SO=/tmp/apkchk/lib/arm64-v8a/libgojni.so
          check() {
            n=$(strings -a "$SO" | grep -c "$2" || true)
            echo "  $1: $n"
            [ "$n" -ge "$3" ] || { echo "::error::$1 (\"$2\") missing"; exit 1; }
          }
          check x365      x365          1
          check efan-UA   Chrome/120.0.0.0 1
          check Blackstone do\ not\ hack\ this\ protocol\ please 1
          check viewTurbo viewTurbo     1
          check fastup    fastup        1
          check oppa      oppa-mod/oppa 1
          check mihomo    mihomo/1.19.25 1
          python3 "$GITHUB_WORKSPACE/scripts/verify_build.py" "$APK"

      - name: Rename APK
        run: |
          set -euo pipefail
          cd "$APK_DIR"
          APK=$(ls *.apk | head -1)
          NEW="NekoBoxF-mod-r${{ github.run_number }}-arm64-v8a.apk"
          mv "$APK" "$NEW"
          echo "APK_FINAL=$APK_DIR/$NEW" >> "$GITHUB_ENV"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NekoBoxF-patched-arm64
          path: ${{ env.APK_FINAL }}
          if-no-files-found: error
          retention-days: 30

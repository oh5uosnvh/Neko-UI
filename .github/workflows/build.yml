name: Build from patches

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: '上游源码仓库 (owner/name)'
        required: true
        default: 'oh5uosnvh/NekoBoxForAndroid'
      upstream_ref:
        description: '上游分支/标签/commit（基线=A01 tag@f167ebc，新上游填其release tag）'
        required: true
        default: 'A01'
      anytls_commit:
        description: 'sing-anytls-shanlian commit'
        required: false
        default: '35fe946085e3cd5782fd095dd5878c7388519895'
      vt_commit:
        description: 'sing-shadowsocks2-vt commit'
        required: false
        default: '8ad5da2'
      fastup_commit:
        description: 'fastup-mod commit (空=HEAD)'
        required: false
        default: '2aba39c395916633200ac72d9fe6dbf10f2b80bd'
      oppa_commit:
        description: 'oppa-mod commit (空=HEAD)'
        required: false
        default: 'e1c78129290656ca4e59ccc48b0c0a7e7acddf0a'

permissions:
  contents: write

concurrency:
  group: build-from-patches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build patched APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout kit
        uses: actions/checkout@v4

      - name: Clone upstream source (with submodules)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.event.inputs.upstream_repo }}
          REF: ${{ github.event.inputs.upstream_ref }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          fi
          git clone --recurse-submodules --jobs 8 "https://github.com/${REPO}.git" upstream
          cd upstream
          git checkout "$REF"
          git submodule update --init --recursive --jobs 8
          git log --oneline -1

      - name: Apply mod patches (9)
        run: |
          cd upstream
          python3 "$GITHUB_WORKSPACE/scripts/apply_all.py"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: '^1.25'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Pin external mod repos
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd upstream
          sed -i "s/^export COMMIT_ANYTLS_SHANLIAN=.*/export COMMIT_ANYTLS_SHANLIAN=\"${{ github.event.inputs.anytls_commit || '35fe946085e3cd5782fd095dd5878c7388519895' }}\"/" buildScript/lib/core/get_source_env.sh
          sed -i "s/^export COMMIT_SING_SS_VT=.*/export COMMIT_SING_SS_VT=\"${{ github.event.inputs.vt_commit || '8ad5da2' }}\"/" buildScript/lib/core/get_source_env.sh
          sed -i "s/^export COMMIT_FASTUP_MOD=.*/export COMMIT_FASTUP_MOD=\"${{ github.event.inputs.fastup_commit || '2aba39c395916633200ac72d9fe6dbf10f2b80bd' }}\"/" buildScript/lib/core/get_source_env.sh
          sed -i "s/^export COMMIT_OPPA_MOD=.*/export COMMIT_OPPA_MOD=\"${{ github.event.inputs.oppa_commit || 'e1c78129290656ca4e59ccc48b0c0a7e7acddf0a' }}\"/" buildScript/lib/core/get_source_env.sh

      - name: LibCore cache
        id: libcore-cache
        uses: actions/cache@v4
        with:
          path: upstream/app/libs/libcore.aar
          key: libcore-${{ hashFiles('upstream/libcore/**', 'upstream/buildScript/**') }}

      - name: Build LibCore
        if: steps.libcore-cache.outputs.cache-hit != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GOSUMDB: off
        run: |
          cd upstream
          go version
          ./run lib core

      - name: Build APK
        env:
          BUILD_PLUGIN: none
          GOSUMDB: off
        run: |
          cd upstream
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_NDK_HOME}" >> local.properties
          ./run init action gradle
          ./gradlew assemblePreviewDebug
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk' | head -1)
          echo "APK_PATH=$APK"
          echo "APK_DIR=$(realpath $(dirname $APK))" >> $GITHUB_ENV

      - name: Verify mods are in the binary
        run: |
          cd upstream
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk' | head -1)
          unzip -o -q "$APK" 'lib/arm64-v8a/libgojni.so' -d /tmp/apkchk
          grep -q "x365" /tmp/apkchk/lib/arm64-v8a/libgojni.so || { echo "::error::x365 missing"; exit 1; }
          grep -q "viewTurbo" /tmp/apkchk/lib/arm64-v8a/libgojni.so || { echo "::error::viewTurbo missing"; exit 1; }
          grep -q "fastup" /tmp/apkchk/lib/arm64-v8a/libgojni.so || { echo "::error::fastup missing"; exit 1; }
          grep -q "oppa-mod/oppa" /tmp/apkchk/lib/arm64-v8a/libgojni.so || { echo "::error::oppa missing"; exit 1; }
          grep -q "mihomo/1.19.25" /tmp/apkchk/lib/arm64-v8a/libgojni.so || { echo "::error::mihomo spoof missing"; exit 1; }
          python3 "$GITHUB_WORKSPACE/scripts/verify_build.py" "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NekoBoxF-patched-arm64
          path: upstream/app/build/outputs/apk/**/NekoBox*.apk
          if-no-files-found: error

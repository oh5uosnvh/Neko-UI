name: Build debug candidate

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Non-release build version; prexx names are reserved for published releases'
        required: true
        default: '1.4.2-mg-2611152340'
      version_code:
        description: 'Base version code (>=49; Android code is base x 5)'
        required: true
        default: '2068'
      signed:
        description: 'Sign with the verified legacy key (requires secrets)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  libcore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: oh5uosnvh/Nekobox-MG
          ref: 9dfda13c6a51009a1de2ea4a818fb8b174577b35
          path: mg
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          sparse-checkout: |
            Neko-shanlian
            Neko-viewTurbo
            Neko-fastup
            Neko-oppa
      - uses: actions/checkout@v4
        with:
          repository: oh5uosnvh/sing-box
          ref: 7d063d4feabd790f832e77a7c99aacfa39b2708a
          path: sing-box
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
      - name: Place kernel checkout beside the app repository
        run: mv sing-box ../sing-box
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: libcore/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: nttld/setup-ndk@v1
        with:
          # Current Cronet archives use AArch64 relocations handled by NDK r28b.
          ndk-version: r28b
          link-to-sdk: true
      - name: Select the installed Cronet-compatible NDK
        shell: bash
        run: |
          set -euo pipefail
          ndkPath="$(python3 - <<'PY'
          import os
          from pathlib import Path
          for root in [Path(os.environ.get('ANDROID_HOME', '')) / 'ndk', Path(os.environ.get('RUNNER_TOOL_CACHE', '')) / 'ndk']:
              if root.is_dir():
                  for props in root.glob('*/source.properties'):
                      if 'Pkg.Revision = 28.' in props.read_text(errors='ignore'):
                          print(props.parent)
                          raise SystemExit
          raise SystemExit('NDK r28b source.properties not found')
          PY
          )"
          echo "ANDROID_NDK_HOME=$ndkPath" >> "$GITHUB_ENV"
          echo "NDK=$ndkPath" >> "$GITHUB_ENV"
      - name: Stage pinned protocol modules at go.mod replacement paths
        run: |
          set -euo pipefail
          cp -a mg/Neko-shanlian ../sing-anytls-shanlian
          cp -a mg/Neko-viewTurbo ../sing-shadowsocks2-vt
          cp -a mg/Neko-fastup ../fastup-mod
          cp -a mg/Neko-oppa ../oppa-mod
          python3 buildScript/lib/core/patch_protocol_modules.py ../oppa-mod
      - name: Validate subscription DNS parser before building
        run: python3 buildScript/test-subscription-dns.py
      - name: Verify pinned DNS runtime and TLS identity
        run: |
          bash buildScript/lib/core/get_source.sh
          cd libcore
          # sing-box 1.14's Android/oomprofile glue uses guarded linkname
          # symbols; the release linker flag must also cover host-side tests.
          export GOFLAGS='-ldflags=-checklinkname=0 -p=2'
          export GOMAXPROCS=2
          # TestRealTCPCancellationClosesBlockedConnection 依赖真实 DNS TCP 出网，
          # 在 CI runner 上偶发超时导致假失败，与代码无关，跳过。
          go test -race -count=1 -skip 'TestRealTCPCancellationClosesBlockedConnection' ./dnspolicy
          go test -count=1 geo_validate.go geo_validate_test.go
          go test -tags with_utls -count=1 vmess_probe_contract_test.go
          go test -tags with_utls -count=1 ./protocol/...
          # Test every host-compatible registry and private constructor; Naive
          # uses Cronet and remains gated by the full Android AAR build.
          go test -tags 'with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_openvpn,with_openconnect,with_tailscale,with_cloudflared' -count=1 . -run 'TestNekoBoxHost|TestStringIterator|TestRealHost|TestSplitLines'
          go test -tags with_utls -count=1 . -run 'TestProbe'
      - name: Verify atomic routing snapshot and failure rollback
        run: |
          cd ../sing-box
          go test -race -count=1 ./adapter -run RuntimeRouting
          go test -race -count=1 . -run RuntimeRouting
          go test -race -count=1 ./route/rule -run 'TestLocalRuleSet(Geo|Ordinary)'
          go test -list '^TestBoxNewStartsAndClosesGeoAliasRuleSets$' . | python3 -c 'import sys; assert "TestBoxNewStartsAndClosesGeoAliasRuleSets" in sys.stdin.read().splitlines(), "required Geo startup test absent"'
          go test -race -count=1 . -run TestBoxNewStartsAndClosesGeoAliasRuleSets
          GOFLAGS='-ldflags=-checklinkname=0' go test -count=1 ./experimental/libbox -run 'TestMarshalTunOptions|TestExchangeContext|TestDuplicateTunDescriptor'
      - name: Build libcore
        run: ./run lib core
      - uses: actions/upload-artifact@v4
        with:
          name: libcore
          path: app/libs/libcore.aar
          if-no-files-found: error

  build:
    runs-on: ubuntu-24.04
    needs: libcore
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: oh5uosnvh/Nekobox-MG
          ref: 9dfda13c6a51009a1de2ea4a818fb8b174577b35
          path: mg
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          sparse-checkout: |
            Neko-shanlian
            Neko-viewTurbo
            Neko-fastup
            Neko-oppa
      - uses: actions/checkout@v4
        with:
          repository: oh5uosnvh/sing-box
          ref: 7d063d4feabd790f832e77a7c99aacfa39b2708a
          path: sing-box
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
      - name: Place kernel checkout beside the app repository
        run: mv sing-box ../sing-box
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: libcore/go.sum
      - name: Stage pinned protocol modules at go.mod replacement paths
        run: |
          set -euo pipefail
          cp -a mg/Neko-shanlian ../sing-anytls-shanlian
          cp -a mg/Neko-viewTurbo ../sing-shadowsocks2-vt
          cp -a mg/Neko-fastup ../fastup-mod
          cp -a mg/Neko-oppa ../oppa-mod
          python3 buildScript/lib/core/patch_protocol_modules.py ../oppa-mod
      - uses: actions/download-artifact@v4
        with:
          name: libcore
          path: app/libs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: nttld/setup-ndk@v1
        with:
          # Current Cronet archives use AArch64 relocations handled by NDK r28b.
          ndk-version: r28b
          link-to-sdk: true
      - name: Select the installed Cronet-compatible NDK
        shell: bash
        run: |
          set -euo pipefail
          ndkPath="$(python3 - <<'PY'
          import os
          from pathlib import Path
          for root in [Path(os.environ.get('ANDROID_HOME', '')) / 'ndk', Path(os.environ.get('RUNNER_TOOL_CACHE', '')) / 'ndk']:
              if root.is_dir():
                  for props in root.glob('*/source.properties'):
                      if 'Pkg.Revision = 28.' in props.read_text(errors='ignore'):
                          print(props.parent)
                          raise SystemExit
          raise SystemExit('NDK r28b source.properties not found')
          PY
          )"
          echo "ANDROID_NDK_HOME=$ndkPath" >> "$GITHUB_ENV"
          echo "NDK=$ndkPath" >> "$GITHUB_ENV"
      - name: Retrieve legacy signing key only for an explicitly signed build
        if: ${{ inputs.signed }}
        uses: actions/checkout@v4
        with:
          repository: oh5uosnvh/Nekobox-MG
          ref: a2267e3e51ff4aa851db4a247b2749dd36f6dfcb
          path: mg-sign
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          sparse-checkout: keystore/release.keystore
          sparse-checkout-cone-mode: false
      - name: Build candidate APKs
        env:
          SING_BOX_CLONE_TOKEN: ${{ secrets.GH_PAT }}
          APP_VERSION_NAME: ${{ inputs.build_version }}
          APP_PRE_VERSION_NAME: ${{ inputs.build_version }}
          APP_VERSION_CODE: ${{ inputs.version_code }}
          SIGNED: ${{ inputs.signed }}
          KEYSTORE_PASS: ${{ inputs.signed && secrets.KEYSTORE_PASS || '' }}
          ALIAS_NAME: ${{ inputs.signed && secrets.ALIAS_NAME || '' }}
          ALIAS_PASS: ${{ inputs.signed && secrets.ALIAS_PASS || '' }}
          FORCE_HEV: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'rm -f release.keystore; rm -rf mg-sign' EXIT
          # Candidate builds may use a numeric version name; never publish a tag here.
          [[ "$APP_VERSION_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,99}$ ]] || { echo 'Invalid build version' >&2; exit 1; }
          [[ ! "$APP_VERSION_NAME" =~ (^|-)pre[0-9]+([-.]|$) ]] || { echo 'prexx build names are reserved for published releases' >&2; exit 1; }
          [[ "$APP_VERSION_CODE" =~ ^[1-9][0-9]{0,8}$ ]] && (( 10#$APP_VERSION_CODE >= 49 && 10#$APP_VERSION_CODE <= 420000000 )) || { echo 'Base version code must be 49..420000000' >&2; exit 1; }
          if [[ "$SIGNED" == true ]]; then
            [[ -n "$KEYSTORE_PASS" && -n "$ALIAS_NAME" && -n "$ALIAS_PASS" && -f mg-sign/keystore/release.keystore ]] || { echo 'Signing credentials or keystore missing' >&2; exit 1; }
            cp mg-sign/keystore/release.keystore release.keystore
            chmod 600 release.keystore
            rm -rf mg-sign
            fingerprint=$(keytool -exportcert -alias "$ALIAS_NAME" -keystore release.keystore -storepass:env KEYSTORE_PASS | sha256sum | cut -d' ' -f1)
            [[ "$fingerprint" == 521ea638c17fdee184998b4a3cf9b10fa6272b9806fae34b19ca3fffe5d4556a ]] || { echo 'Unexpected signing certificate' >&2; exit 1; }
          else
            unset KEYSTORE_PASS ALIAS_NAME ALIAS_PASS
          fi
          ./run init action gradle
          # Bootstrap the exact wrapper distribution via the official asset API;
          # services.gradle.org redirects can fail while this endpoint works.
          python3 buildScript/download-github-asset.py \
            https://api.github.com/repos/gradle/gradle-distributions/releases/assets/194456564 \
            "$RUNNER_TEMP/gradle-8.10.2-bin.zip"
          echo "31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26  $RUNNER_TEMP/gradle-8.10.2-bin.zip" | sha256sum -c -
          python3 - "$RUNNER_TEMP/gradle-8.10.2-bin.zip" <<'PY'
          import pathlib, sys
          wrapper = pathlib.Path('gradle/wrapper/gradle-wrapper.properties')
          wrapper.write_text(wrapper.read_text().replace(
              'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-bin.zip',
              'distributionUrl=' + pathlib.Path(sys.argv[1]).as_uri()))
          PY
          # Resolve only this exact module from a hash-verified local Maven
          # directory: Gradle otherwise HEADs the failing remote even with a jar cache.
          export NEKO_PINNED_MAVEN="$RUNNER_TEMP/pinned-maven"
          compiler_cache="$NEKO_PINNED_MAVEN/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21"
          mkdir -p "$compiler_cache"
          python3 buildScript/download-github-asset.py \
            https://api.github.com/repos/JetBrains/kotlin/releases/assets/587823233 \
            "$compiler_cache/kotlin-compiler-embeddable-2.0.21.jar"
          echo "9fa8cdd1de0dccffe154c997d423ec6b5f53cd6d9177e3a77a9b0de03fb1bc81  $compiler_cache/kotlin-compiler-embeddable-2.0.21.jar" | sha256sum -c -
          curl -fLSs --retry 3 --max-time 60 \
            https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21/kotlin-compiler-embeddable-2.0.21.pom \
            -o "$compiler_cache/kotlin-compiler-embeddable-2.0.21.pom"
          echo "bd4656a46ec418252e5bc5e1c20eb2029fb2a8e0e3cc94eeddfac7e87c8cd5b6  $compiler_cache/kotlin-compiler-embeddable-2.0.21.pom" | sha256sum -c -
          ./gradlew --no-daemon --stacktrace --info app:testPreviewDebugUnitTest --tests 'io.nekohasekai.sagernet.group.*' --tests 'io.nekohasekai.sagernet.ui.*' --tests 'io.nekohasekai.sagernet.database.*' --tests 'io.nekohasekai.sagernet.fmt.*'
          # Prove the concurrency/cancellation tests actually ran, before the
          # following DNS-only invocation replaces the test-result directory.
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('app/build/test-results/testPreviewDebugUnitTest')
          for name, minimum in [('UrlTestPolicyTest', 5), ('CancellableProbeTest', 5)]:
              report = root / ('TEST-io.nekohasekai.sagernet.group.' + name + '.xml')
              suite = ET.parse(report).getroot()
              assert int(suite.get('tests', '0')) >= minimum, name + ' did not run'
              assert int(suite.get('failures', '0')) == 0 and int(suite.get('errors', '0')) == 0, name + ' failed'
          PY
          mkdir -p app/build/reports/urltest-performance
          cp app/build/test-results/testPreviewDebugUnitTest/TEST-io.nekohasekai.sagernet.group.*ProbeTest.xml app/build/reports/urltest-performance/ || true
          cp app/build/test-results/testPreviewDebugUnitTest/TEST-io.nekohasekai.sagernet.group.UrlTestPolicyTest.xml app/build/reports/urltest-performance/
          bash buildScript/lib/core/get_source.sh
          bash buildScript/check-dns14.sh
          ./gradlew --no-daemon app:assemblePreviewRelease
          mkdir -p release
          shopt -s nullglob
          apks=(app/build/outputs/apk/preview/release/*.apk)
          (( ${#apks[@]} > 0 )) || { echo 'No APKs found' >&2; exit 1; }
          if [[ "$SIGNED" == true ]]; then
            for apk in "${apks[@]}"; do
              "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-certs.txt"
              python3 buildScript/verify-apk-cert.py "$RUNNER_TEMP/apk-certs.txt"
            done
          fi
          cp "${apks[@]}" release/
          (cd release && sha256sum ./*.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            **/hs_err_pid*.log
            **/replay_pid*.log
            **/test-worker*.log
            app/build/test-results/testPreviewDebugUnitTest/
            app/build/reports/tests/testPreviewDebugUnitTest/
            app/build/reports/urltest-performance/
            app/build/reports/ui-pre4/
            app/build/reports/ui-pre12/
            app/build/reports/ui-pre13/
            app/build/reports/ui-pre14/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-apks
          path: release/
          if-no-files-found: error

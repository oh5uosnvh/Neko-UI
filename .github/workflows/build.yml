name: Build from patches

# Neko = immutable upstream A01 + latest Neko-UI 33 UI patches
#       + Nekobox-MG X365/xhttp/ViewTurbo/other non-Snell protocol mods
#
# The protocol mods are NOT baked into the upstream checkout: this workflow
# pulls Nekobox-MG at a pinned ref and injects its patched integration layer so
# the two repos always build together from a single run.

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: '上游源码仓库 (owner/name)'
        required: true
        default: 'oh5uosnvh/NekoBoxForAndroid'
      upstream_ref:
        description: '上游分支/标签/commit'
        required: true
        default: 'f167ebc88e9a733e65380e13dab39726eba917b2'
      mods_ref:
        description: 'Nekobox-MG ref (协议魔改源码, 空=HEAD)'
        required: false
        default: 'feature/r98-clean'
      anytls_commit:
        description: 'sing-anytls-shanlian commit (空=HEAD)'
        required: false
        default: ''
      vt_commit:
        description: 'sing-shadowsocks2-vt commit (空=HEAD)'
        required: false
        default: 'agent/vt-dual-marker'
      fastup_commit:
        description: 'fastup-mod commit (空=HEAD)'
        required: false
        default: ''
      oppa_commit:
        description: 'oppa-mod commit (空=HEAD)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-from-patches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- wire test
  # Compiles Nekobox-MG's x365 package and runs the byte-exact vectors captured
  # from the official 1.0.63 client. Fails in ~30s instead of ~20min.
  wire-test:
    name: x365 wire-format tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kit
        uses: actions/checkout@v4

      - name: Clone Nekobox-MG (protocol mods)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          MODS_REF: ${{ github.event.inputs.mods_ref }}
        run: |
          set -euo pipefail
          URL="https://github.com/oh5uosnvh/Nekobox-MG.git"
          [ -n "$GH_PAT" ] && URL="https://x-access-token:${GH_PAT}@github.com/oh5uosnvh/Nekobox-MG.git"
          git clone --depth 1 "$URL" mods
          if [ -z "$MODS_REF" ]; then MODS_REF="agent/compatibility"; fi
          if [ -n "$MODS_REF" ]; then
            git -C mods fetch --depth 1 origin "$MODS_REF"
            git -C mods checkout --detach FETCH_HEAD
          fi
          git -C mods log --oneline -1

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Build minimal module around protocol/x365
        run: |
          set -euo pipefail
          rm -rf wirecheck && mkdir -p wirecheck/x365
          cp mods/Neko-365/libcore/protocol/x365/conn.go \
             mods/Neko-365/libcore/protocol/x365/conn_test.go wirecheck/x365/
          cd wirecheck
          cat > go.mod <<'EOF'
          module x365check

          go 1.23

          require (
              github.com/gofrs/uuid/v5 v5.3.0
              github.com/sagernet/sing v0.6.0
              github.com/sagernet/sing-vmess v0.2.0
          )
          EOF

      - name: go mod tidy
        working-directory: wirecheck
        env:
          GOFLAGS: -mod=mod
          GOTOOLCHAIN: local
        run: go mod tidy

      - name: Run wire tests
        working-directory: wirecheck
        env:
          GOFLAGS: -mod=mod
          GOTOOLCHAIN: local
        run: go test ./x365/ -v

  # -------------------------------------------------------------------- build
  build:
    name: Build patched APK
    runs-on: ubuntu-latest
    needs: wire-test
    timeout-minutes: 90
    steps:
      - name: Checkout kit
        uses: actions/checkout@v4

      - name: Clone upstream source (with submodules)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.event.inputs.upstream_repo }}
          REF: ${{ github.event.inputs.upstream_ref }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          fi
          git clone --recurse-submodules --jobs 8 "https://github.com/${REPO}.git" upstream
          cd upstream
          git checkout "$REF"
          git submodule update --init --recursive --jobs 8
          ACTUAL_A01="f167ebc88e9a733e65380e13dab39726eba917b2"
          if [ "$REPO" = "oh5uosnvh/NekoBoxForAndroid" ] && [ "$REF" = "$ACTUAL_A01" ]; then
            test "$(git rev-parse HEAD)" = "$ACTUAL_A01" || {
              echo "::error::requested A01 did not resolve to the immutable expected commit"; exit 1;
            }
          fi
          git log --oneline -1

      - name: Clone Nekobox-MG (protocol mods)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          MODS_REF: ${{ github.event.inputs.mods_ref }}
        run: |
          set -euo pipefail
          URL="https://github.com/oh5uosnvh/Nekobox-MG.git"
          [ -n "$GH_PAT" ] && URL="https://x-access-token:${GH_PAT}@github.com/oh5uosnvh/Nekobox-MG.git"
          git clone --depth 1 "$URL" mods
          if [ -z "$MODS_REF" ]; then MODS_REF="agent/compatibility"; fi
          if [ -n "$MODS_REF" ]; then
            git -C mods fetch --depth 1 origin "$MODS_REF"
            git -C mods checkout --detach FETCH_HEAD
          fi
          echo "mods @ $(git -C mods log --oneline -1)"

      - name: Assert clean r98 upstream base
        run: |
          set -euo pipefail
          cd upstream
          ! grep -q 'yfbridge\|Blackstone\|snell-yf' libcore/box_include.go || exit 1

      - name: Apply official r98 UI and suffix-only protocol contracts
        run: |
          cd upstream
          python3 "$GITHUB_WORKSPACE/scripts/apply_all.py"
          python3 "$GITHUB_WORKSPACE/scripts/apply_safe_migration.py" .
          python3 "$GITHUB_WORKSPACE/scripts/apply_group_shortcut.py" .
          python3 "$GITHUB_WORKSPACE/scripts/remove_group_filter_segment.py" .
          python3 "$GITHUB_WORKSPACE/scripts/apply_subscription_import_fix.py" .
          python3 "$GITHUB_WORKSPACE/scripts/apply_large_ops_undo.py" .
          python3 "$GITHUB_WORKSPACE/scripts/apply_ui_network.py" .
          python3 "$GITHUB_WORKSPACE/scripts/apply_official_tray.py" .
          python3 "$GITHUB_WORKSPACE/scripts/apply_statsbar_init.py" .
          python3 "$GITHUB_WORKSPACE/scripts/apply_manual_tray_test_only.py" .
          python3 "$GITHUB_WORKSPACE/scripts/apply_chain_picker_alignment.py" .
          python3 "$GITHUB_WORKSPACE/scripts/apply_x365_core.py" . ../mods
          python3 "$GITHUB_WORKSPACE/scripts/apply_final_protocols.py" . ../mods
          python3 "$GITHUB_WORKSPACE/scripts/apply_x365_vless_only.py" .
          python3 "$GITHUB_WORKSPACE/scripts/apply_suffix_contract.py" .
          python3 "$GITHUB_WORKSPACE/scripts/apply_bulk_undo_counts.py" .
          python3 "$GITHUB_WORKSPACE/scripts/apply_profile_batch_pipeline.py" .
          python3 "$GITHUB_WORKSPACE/scripts/remove_ip_surface.py" .
          python3 "$GITHUB_WORKSPACE/scripts/assert_no_ip.py" .
          ! rg -n 'Blackstone|snell-yf|yfbridge|apply_blackstone|prepare_yf' libcore app/src/main/java

      - name: Assert clean r98 source and undo paths
        run: |
          set -euo pipefail
          cd upstream
          grep -q 'undoManager.remove' app/src/main/java/io/nekohasekai/sagernet/ui/ConfigurationFragment.kt
          grep -q 'fun isUndoReady' app/src/main/java/io/nekohasekai/sagernet/ui/ConfigurationFragment.kt
          grep -q 'type = "vless"' app/src/main/java/io/nekohasekai/sagernet/fmt/v2ray/V2RayFmt.kt
          ! rg -n 'Blackstone|snell-yf|yfbridge|xhttp-yf' libcore app/src/main/java
          ! grep -q 'deleteUnavailable(groupId)' app/src/main/java/io/nekohasekai/sagernet/ui/ConfigurationFragment.kt

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: '^1.25'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      # Resolve every external mod repo to a concrete commit. The 2026-10-05
      # rebuild recreated these repos and changed all shas; empty input = HEAD.
      - name: Resolve external mod refs
        id: resolve
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          resolve() {
            repo="$1"; ref="$2"
            if [ -n "$ref" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token ${GH_PAT}" \
                     "https://api.github.com/repos/${repo}/commits/${ref}")
              if [ "$code" = "200" ]; then echo "$ref"; return; fi
              echo "::warning::${repo}: ref '${ref}' not found (HTTP ${code}); using HEAD" >&2
            fi
            curl -s -H "Authorization: token ${GH_PAT}" \
              "https://api.github.com/repos/${repo}/commits/HEAD" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["sha"])'
          }
          ANYTLS=$(resolve oh5uosnvh/sing-anytls-shanlian "${{ github.event.inputs.anytls_commit }}")
          # The VT module is taken from the pinned Nekobox-MG source below.
          VT="in-tree-viewturbo"
          FASTUP=$(resolve oh5uosnvh/fastup-mod "${{ github.event.inputs.fastup_commit }}")
          OPPA=$(resolve oh5uosnvh/oppa-mod "${{ github.event.inputs.oppa_commit }}")
          echo "anytls=${ANYTLS}" >> "$GITHUB_OUTPUT"
          echo "vt=${VT}"         >> "$GITHUB_OUTPUT"
          echo "fastup=${FASTUP}" >> "$GITHUB_OUTPUT"
          echo "oppa=${OPPA}"     >> "$GITHUB_OUTPUT"

      - name: Pin external mod repos
        env:
          ANYTLS: ${{ steps.resolve.outputs.anytls }}
          VT: ${{ steps.resolve.outputs.vt }}
          FASTUP: ${{ steps.resolve.outputs.fastup }}
          OPPA: ${{ steps.resolve.outputs.oppa }}
        run: |
          set -euo pipefail
          cd upstream
          F=buildScript/lib/core/get_source_env.sh
          [ -f "$F" ] || { echo "::error::$F missing"; exit 1; }
          set_kv() {
            key="$1"; val="$2"
            if grep -q "^export ${key}=" "$F"; then
              sed -i "s|^export ${key}=.*|export ${key}=\"${val}\"|" "$F"
            else
              echo "export ${key}=\"${val}\"" >> "$F"
            fi
          }
          set_kv COMMIT_ANYTLS_SHANLIAN "$ANYTLS"
          set_kv COMMIT_SING_SS_VT       "$VT"
          set_kv COMMIT_FASTUP_MOD       "$FASTUP"
          set_kv COMMIT_OPPA_MOD         "$OPPA"
          echo "--- $F ---"; cat "$F"

      - name: Stage tested ViewTurbo user-auth module
        run: |
          set -euo pipefail
          python3 mods/Neko-gjgx/stage_viewturbo.py upstream
          cd sing-shadowsocks2-vt
          go test ./... -count=1
          go vet ./...
          cmp shadowaead/method.go ../mods/Neko-viewTurbo/shadowaead/method.go
          cmp shadowaead/vt_auth.go ../mods/Neko-viewTurbo/shadowaead/vt_auth.go

      - name: LibCore cache key
        id: libcore-key
        run: |
          cd upstream
          # Source overlays are not git-tracked. Hash the actual bytes being
          # built, including newly overlaid protocol files and symlink targets.
          K=$( { find libcore buildScript -type f -print0 | sort -z | xargs -0 sha256sum; git rev-parse HEAD; } | sha256sum | cut -d' ' -f1 )
          echo "key=libcore-$K" >> "$GITHUB_OUTPUT"

      - name: LibCore cache
        id: libcore-cache
        uses: actions/cache@v4
        with:
          path: upstream/app/libs/libcore.aar
          key: ${{ steps.libcore-key.outputs.key }}

      - name: Build LibCore
        if: steps.libcore-cache.outputs.cache-hit != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GOSUMDB: off
        run: |
          cd upstream
          go version
          ./run lib core

      - name: Verify x365 wire tests already passed
        run: echo 'x365 wire-format job passed; skipping duplicate stale upstream package test'

      - name: Check libcore.aar ABI coverage
        run: |
          set -euo pipefail
          cd upstream
          AAR=app/libs/libcore.aar
          test -s "$AAR" || { echo "::error::$AAR missing (libcore build/cache)"; exit 1; }
          echo "--- jni/ ABIs in libcore.aar ---"
          unzip -l "$AAR" | grep -o 'jni/[^/]*/' | sort -u || true
          for abi in arm64-v8a armeabi-v7a; do
            unzip -l "$AAR" | grep -q "jni/$abi/libgojni.so" \
              || { echo "::error::libcore.aar 缺少 jni/$abi/libgojni.so（gomobile 目标不全）"; exit 1; }
          done
          echo "libcore.aar: arm64-v8a + armeabi-v7a 双 so 齐全"

      - name: Restore stable signing keystore (from private Nekobox-MG)
        run: |
          set -euo pipefail
          # 覆盖上游自带的 starifly release.keystore（口令不在本仓库）。
          # 稳定签名 = 跨构建可覆盖安装；比 debug 构建的 runner 随机调试签名强。
          cp mods/keystore/release.keystore upstream/release.keystore
          test -s upstream/release.keystore
          echo "keystore restored: $(sha256sum upstream/release.keystore | cut -c1-16)…"

      - name: Refresh geo assets version (404 self-heal)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # A01 的 assets.sh 把 geoip/geosite 钉死在旧版本号（当年为躲 API 限流），
          # 旧 release 一失效下载就 404。这里动态取最新 release 号替换——带 token
          # 防 runner 限流。geo 滚动更新后无需再手动修版本。
          cd upstream
          GEOIP=$(curl -fsSL -H "Authorization: token ${GH_PAT}" \
            "https://api.github.com/repos/SagerNet/sing-geoip/releases/latest" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')
          GEOSITE=$(curl -fsSL -H "Authorization: token ${GH_PAT}" \
            "https://api.github.com/repos/SagerNet/sing-geosite/releases/latest" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')
          sed -i "s/^VERSION_GEOIP=.*/VERSION_GEOIP=$GEOIP/" buildScript/lib/assets.sh
          sed -i "s/^VERSION_GEOSITE=.*/VERSION_GEOSITE=$GEOSITE/" buildScript/lib/assets.sh
          echo "geoip=$GEOIP geosite=$GEOSITE"
          grep -n "VERSION_GEOIP=\|VERSION_GEOSITE=" buildScript/lib/assets.sh

      - name: Pin Neko package and label
        run: python3 "$GITHUB_WORKSPACE/scripts/fix_application_id.py" upstream

      - name: Patch build config (release lint gate + dual ABI)
        run: |
          set -euo pipefail
          cd upstream
          # checkAllWarnings+warningsAsErrors 是 debug 期全量 lint 策略；release 构建只
          # 保留 lintVital 的 fatal 检查关不动的部分。CI 不让 lint 噪音挡出包。
          sed -i 's/checkReleaseBuilds = true/checkReleaseBuilds = false/' \
            buildSrc/src/main/kotlin/Helpers.kt
          # 双架构：A01 把 splits 钉死在 arm64-v8a；放开 armeabi-v7a，
          # 一次 gradle 构建同时产出两个 ABI 的 split APK。
          sed -i 's/include("arm64-v8a")/include("arm64-v8a", "armeabi-v7a")/' \
            buildSrc/src/main/kotlin/Helpers.kt
          grep -n 'checkReleaseBuilds\|include(' buildSrc/src/main/kotlin/Helpers.kt
          grep -q 'include("arm64-v8a", "armeabi-v7a")' buildSrc/src/main/kotlin/Helpers.kt \
            || { echo "::error::dual-ABI split patch failed"; exit 1; }

      - name: Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('upstream/buildSrc/src/main/kotlin/*.kt', 'upstream/app/build.gradle.kts', 'upstream/build.gradle.kts', 'upstream/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APKs (release = R8 shrink + shrinkResources, signed, dual ABI)
        env:
          BUILD_PLUGIN: none
          GOSUMDB: off
        run: |
          set -euo pipefail
          cd upstream
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_NDK_HOME}" >> local.properties
          ./run init action gradle
          set -a; . ../mods/keystore/keystore.properties; set +a
          ./gradlew app:testPreviewDebugUnitTest --tests 'io.nekohasekai.sagernet.ui.GroupShortcutRegressionTest' --tests 'io.nekohasekai.sagernet.ui.GroupDatabaseMigrationTest' --tests 'io.nekohasekai.sagernet.ui.NetworkUiRegressionTest' --tests 'io.nekohasekai.sagernet.ui.OfficialTrayRegressionTest' --tests 'io.nekohasekai.sagernet.ui.TrayGeometryRegressionTest' --tests 'io.nekohasekai.sagernet.ui.TrayDynamicContentTest' --tests 'io.nekohasekai.sagernet.ui.TraySurfaceFeedbackTest' --tests 'io.nekohasekai.sagernet.ui.OppaYamlImportTest' --tests 'io.nekohasekai.sagernet.ui.BulkUndoCountTest' --tests 'io.nekohasekai.sagernet.ui.ProfileHundredThousandTest'
          ./gradlew app:assemblePreviewRelease
          OUT=app/build/outputs/apk
          N64=$(find "$OUT" -name '*arm64-v8a*.apk' | wc -l)
          N32=$(find "$OUT" -name '*armeabi-v7a*.apk' | wc -l)
          [ "$N64" = "1" ] || { echo "::error::arm64-v8a APK 数量=$N64（应为 1）"; exit 1; }
          [ "$N32" = "1" ] || { echo "::error::armeabi-v7a APK 数量=$N32（应为 1）"; exit 1; }
          APK_DIR="$(realpath "$OUT")"
          APK_ARM64="$APK_DIR/$(cd "$OUT" && find . -name '*arm64-v8a*.apk' | sed 's|^\./||')"
          APK_ARM32="$APK_DIR/$(cd "$OUT" && find . -name '*armeabi-v7a*.apk' | sed 's|^\./||')"
          echo "APK_DIR=$APK_DIR"     >> "$GITHUB_ENV"
          echo "APK_ARM64=$APK_ARM64" >> "$GITHUB_ENV"
          echo "APK_ARM32=$APK_ARM32" >> "$GITHUB_ENV"
          ls -la "$APK_DIR"

      - name: Verify both APKs (libgojni markers + dex anchors)
        run: |
          bash "$GITHUB_WORKSPACE/scripts/assert_apk.sh" "$APK_ARM64"
          bash "$GITHUB_WORKSPACE/scripts/assert_apk.sh" "$APK_ARM32"

      - name: Rename APKs + SHA256 manifest
        run: |
          set -euo pipefail
          cd "$APK_DIR"
          F64="Neko-mod-r${{ github.run_number }}-arm64-v8a.apk"
          F32="Neko-mod-r${{ github.run_number }}-armeabi-v7a.apk"
          mv "$APK_ARM64" "$F64"
          mv "$APK_ARM32" "$F32"
          SUMS="SHA256SUMS-r${{ github.run_number }}.txt"
          sha256sum "$F64" "$F32" > "$SUMS"
          cat "$SUMS"
          echo "FINAL_64=$APK_DIR/$F64" >> "$GITHUB_ENV"
          echo "FINAL_32=$APK_DIR/$F32" >> "$GITHUB_ENV"
          echo "SUMS=$APK_DIR/$SUMS"    >> "$GITHUB_ENV"

      - name: Upload group UI and database regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Group-UI-regression-tests
          path: |
            upstream/app/build/test-results/testPreviewDebugUnitTest/
            upstream/app/build/reports/tests/testPreviewDebugUnitTest/
          if-no-files-found: warn

      - name: Upload arm64-v8a artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neko-arm64
          path: ${{ env.FINAL_64 }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload armeabi-v7a artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neko-armv7
          path: ${{ env.FINAL_32 }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload SHA256SUMS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neko-SHA256SUMS
          path: ${{ env.SUMS }}
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          {
            echo "## Neko r${{ github.run_number }}（A01 双架构）"
            echo ""
            echo '| 文件 | SHA256（前 16 位） |'
            echo '|---|---|'
            while read -r h f; do
              printf '| `%s` | `%s…` |\n' "${f#*mod-}" "${h:0:16}"
            done < "$SUMS"
            echo ""
            echo '完整 SHA256 见 artifact `Neko-SHA256SUMS`。'
          } >> "$GITHUB_STEP_SUMMARY"
